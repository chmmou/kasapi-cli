name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release + upload assets
  id-token: write   # cosign keyless signing via GitHub OIDC
  packages: write   # reserved for future container/OCI publishing

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # goreleaser needs full history + tags

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: install cosign
        # Do not pin cosign-release: goreleaser-action verifies its own
        # download with the cosign installed here, and newer
        # goreleaser releases ship a bundle format that cosign 2.4.1
        # cannot read ("bundle does not contain cert for
        # verification"). Letting cosign-installer pick its current
        # default keeps it in step with goreleaser-action.
        uses: sigstore/cosign-installer@v3

      - name: "install syft (used by goreleaser sboms: block)"
        uses: anchore/sbom-action/download-syft@v0

      - name: goreleaser release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
